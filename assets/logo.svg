<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1a33"/>
      <stop offset="1" stop-color="#0a0a12"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9fca"/>
      <stop offset="1" stop-color="#8b7fff"/>
    </linearGradient>
    <linearGradient id="tile2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a59bff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#a59bff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="#8b7fff" stroke-opacity="0.35" stroke-width="2"/>
  <!-- falling tiles -->
  <rect x="40" y="14" width="16" height="42" rx="4" fill="url(#tile)" filter="url(#glow)"/>
  <rect x="78" y="30" width="14" height="22" rx="4" fill="url(#tile2)"/>
  <!-- hit line -->
  <rect x="16" y="66" width="96" height="3" rx="1.5" fill="#a59bff" filter="url(#glow)"/>
  <!-- keys -->
  <g>
    <rect x="18" y="74" width="22" height="38" rx="4" fill="#f4f4f8"/>
    <rect x="42" y="74" width="22" height="38" rx="4" fill="#a59bff"/>
    <rect x="66" y="74" width="22" height="38" rx="4" fill="#f4f4f8"/>
    <rect x="90" y="74" width="20" height="38" rx="4" fill="#f4f4f8"/>
    <rect x="33" y="74" width="13" height="22" rx="3" fill="#15151f"/>
    <rect x="59" y="74" width="13" height="22" rx="3" fill="#15151f"/>
    <rect x="83" y="74" width="13" height="22" rx="3" fill="#15151f"/>
  </g>
</svg>
